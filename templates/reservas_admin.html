<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Reservas</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            margin:40px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            margin-top:20px;
        }

        th,td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        th{
            background:#2c3e50;
            color:white;
        }

        tr:nth-child(even){
            background:#f8f8f8;
        }

        a{
            text-decoration:none;
        }

        .eliminar{
            background:#d9534f;
            color:white;
            padding:6px 12px;
            border-radius:5px;
        }

        .volver{
            display:inline-block;
            margin-top:20px;
            background:#007bff;
            color:white;
            padding:10px 20px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<h1>Gestión de Reservas</h1>

<table>

    <tr>

        <th>ID</th>
        <th>Usuario</th>
        <th>Libro</th>
        <th>Fecha</th>
        <th>Estado</th>
        <th>Acción</th>

    </tr>

    {% for reserva in reservas %}

    <tr>

        <td>{{ reserva[0] }}</td>
        <td>{{ reserva[1] }}</td>
        <td>{{ reserva[2] }}</td>
        <td>{{ reserva[3] }}</td>
        <td>{{ reserva[4] }}</td>

        <td>

            <a class="eliminar"
               href="/eliminar_reserva/{{ reserva[0] }}"
               onclick="return confirm('¿Eliminar esta reserva?')">

                Eliminar

            </a>

        </td>

    </tr>

    {% endfor %}

</table>

<a class="volver" href="/admin">
    ← Volver al panel
</a>

</body>
</html>
