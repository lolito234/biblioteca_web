<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cambiar Contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">

                    <h3 class="text-center">

                        🔒 Cambiar Contraseña

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Contraseña actual

                            </label>

                            <input
                                type="password"
                                name="actual"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Nueva contraseña

                            </label>

                            <input
                                type="password"
                                name="nueva"
                                class="form-control"
                                required>

                        </div>

                        <button class="btn btn-success w-100">

                            Guardar Contraseña

                        </button>

                    </form>

                    <hr>

                    <a href="/perfil" class="btn btn-secondary w-100">

                        Cancelar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
