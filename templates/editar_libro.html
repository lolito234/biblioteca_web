<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3 class="text-center">

                        ✏ Editar Libro

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">

                            <label class="form-label">

                                Título

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="titulo"
                                value="{{ libro[1] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Autor

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="autor"
                                value="{{ libro[2] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Categoría

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="categoria"
                                value="{{ libro[3] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Stock

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="stock"
                                value="{{ libro[4] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Descripción

                            </label>

                            <textarea
                                class="form-control"
                                rows="4"
                                name="descripcion">{{ libro[5] }}</textarea>

                        </div>

                        {% if libro[6] %}

                        <div class="mb-3 text-center">

                            <label class="form-label">

                                Imagen actual

                            </label>

                            <br>

                            <img
                                src="{{ url_for('static', filename='img/libros/' + libro[6]) }}"
                                class="img-fluid rounded shadow"
                                style="max-height:250px;">

                        </div>

                        {% endif %}

                        <div class="mb-3">

                            <label class="form-label">

                                Cambiar imagen

                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="imagen"
                                accept="image/*">

                        </div>

                        <button class="btn btn-success w-100">

                            💾 Guardar Cambios

                        </button>

                    </form>

                </div>

                <div class="card-footer">

                    <a href="/libros_admin" class="btn btn-secondary">

                        ⬅ Volver

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
