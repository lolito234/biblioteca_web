<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editar Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>✏ Editar Usuario</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Nombre</label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ usuario[1] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Correo</label>

                    <input
                        type="email"
                        name="correo"
                        class="form-control"
                        value="{{ usuario[2] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Rol</label>

                    <select name="rol" class="form-select">

                        <option value="usuario"
                        {% if usuario[3]=='usuario' %}selected{% endif %}>
                        Usuario
                        </option>

                        <option value="admin"
                        {% if usuario[3]=='admin' %}selected{% endif %}>
                        Administrador
                        </option>

                    </select>

                </div>

                <button class="btn btn-success">

                    💾 Guardar Cambios

                </button>

                <a href="/usuarios" class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
