<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Libro</title>
</head>
<body>

    <h1>Agregar Libro</h1>

    <form method="POST">
        <input type="text" name="titulo" placeholder="Título" required><br><br>
        <input type="text" name="autor" placeholder="Autor" required><br><br>
        <input type="text" name="categoria" placeholder="Categoría"><br><br>
        <input type="number" name="stock" placeholder="Stock" required><br><br>
        <textarea name="descripcion" placeholder="Descripción"></textarea><br><br>

        <button type="submit">Guardar</button>
    </form>

    <br>
    <a href="/">Volver</a>

</body>
</html>
