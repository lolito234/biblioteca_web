<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Administrar Libros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">

        📚 Administración de Libros

    </h2>

    <div class="mb-3">

        <a href="/agregar_libro" class="btn btn-success">

            ➕ Nuevo Libro

        </a>

        <a href="/admin" class="btn btn-secondary">

            ⬅ Volver al Panel

        </a>

    </div>

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Título</th>

                <th>Autor</th>

                <th>Categoría</th>

                <th>Stock</th>

                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

        {% for libro in libros %}

            <tr>

                <td>{{ libro[0] }}</td>

                <td>{{ libro[1] }}</td>

                <td>{{ libro[2] }}</td>

                <td>{{ libro[3] }}</td>

                <td>{{ libro[4] }}</td>

                <td>

                    <a href="/editar_libro/{{ libro[0] }}" class="btn btn-warning btn-sm">

                        ✏ Editar

                    </a>

                    <a href="/eliminar_libro/{{ libro[0] }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Eliminar este libro?')">

                        🗑 Eliminar

                    </a>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
