<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Gestionar Devoluciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">

        📦 Devoluciones Pendientes de Verificación

    </h2>

    {% if devoluciones %}

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Usuario</th>

                <th>Libro</th>

                <th>Fecha solicitud</th>

                <th>Verificación</th>

            </tr>

        </thead>

        <tbody>

        {% for d in devoluciones %}

            <tr>

                <td>{{ d[0] }}</td>

                <td>{{ d[1] }}</td>

                <td>{{ d[2] }}</td>

                <td>{{ d[4] }}</td>

                <td>

                    <form action="/verificar_devolucion/{{ d[0] }}" method="POST" class="row g-2 align-items-center">

                        <div class="col-auto">

                            <select name="estado_libro" class="form-select form-select-sm" required>

                                <option value="bueno">✅ Buen estado</option>

                                <option value="dañado">⚠ Dañado</option>

                            </select>

                        </div>

                        <div class="col-auto">

                            <input type="number" step="0.01" min="0" name="multa" class="form-control form-control-sm" placeholder="Multa S/">

                        </div>

                        <div class="col-auto">

                            <input type="text" name="observaciones" class="form-control form-control-sm" placeholder="Observaciones">

                        </div>

                        <div class="col-auto">

                            <button class="btn btn-primary btn-sm">Registrar</button>

                        </div>

                    </form>

                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="alert alert-info">

        No hay devoluciones pendientes de verificación.

    </div>

    {% endif %}

    <a href="/admin" class="btn btn-secondary">

        ⬅ Volver al Panel

    </a>

</div>

</body>

</html>
